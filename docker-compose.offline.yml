name: dingtalk-travel-reimbursement

services:
  backend:
    platform: ${TARGET_PLATFORM:-linux/amd64}
    image: ${BACKEND_IMAGE:-ghcr.io/beardrinkbeer/dingtalk-travel-reimbursement/backend:latest}
    env_file:
      - .env
    environment:
      # These files and directories are already included or created in the image/volumes.
      EXCEL_TEMPLATE_PATH: /app/app/templates/expense_template.xlsx
      REIMBURSEMENT_STAGING_DIR: /app/staging
      OCR_MODE: local
      OCR_ENGINE: paddle_static
      OCR_DETECTION_MODEL_DIR: ${OCR_DETECTION_MODEL_DIR:-/opt/expense/models/PP-OCRv6_small_det}
      OCR_RECOGNITION_MODEL_DIR: ${OCR_RECOGNITION_MODEL_DIR:-/opt/expense/models/PP-OCRv6_small_rec}
    volumes:
      - sqlite_data:/app/data
      - reimbursement_staging:/app/staging
      - ${OCR_MODEL_HOST_DIR:-./backend/models}:/opt/expense/models:ro
    read_only: true
    mem_limit: ${BACKEND_MEMORY_LIMIT:-3g}
    pids_limit: ${BACKEND_PIDS_LIMIT:-128}
    tmpfs:
      - /tmp/expense:uid=10001,gid=10001,mode=0700,size=1073741824
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen('http://127.0.0.1:8000/api/ready', timeout=5).read()
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: ${BACKEND_LOG_MAX_SIZE:-10m}
        max-file: ${BACKEND_LOG_MAX_FILES:-3}
    restart: unless-stopped

  web:
    platform: ${TARGET_PLATFORM:-linux/amd64}
    image: ${WEB_IMAGE:-ghcr.io/beardrinkbeer/dingtalk-travel-reimbursement/frontend:latest}
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${APP_BIND_ADDRESS:-127.0.0.1}:${APP_PORT:-8080}:8080"
    configs:
      - source: nginx.conf
        target: /tmp/nginx.conf
    command:
      - -c
      - /tmp/nginx.conf
      - -g
      - daemon off;
    user: "101:101"
    read_only: true
    mem_limit: ${WEB_MEMORY_LIMIT:-128m}
    pids_limit: ${WEB_PIDS_LIMIT:-64}
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:uid=101,gid=101,mode=0700,size=8m
      - /var/cache/nginx:uid=101,gid=101,mode=0700,size=32m
      - /var/run:uid=101,gid=101,mode=0700,size=1m
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1:8080/]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: ${WEB_LOG_MAX_SIZE:-5m}
        max-file: ${WEB_LOG_MAX_FILES:-3}
    restart: unless-stopped

configs:
  nginx.conf:
    content: |
      pid /tmp/nginx.pid;
      error_log /dev/stderr warn;
      worker_processes auto;

      events {
          worker_connections 1024;
      }

      http {
          include /etc/nginx/mime.types;
          default_type application/octet-stream;
          sendfile on;
          server_tokens off;

          client_body_temp_path /var/cache/nginx/client_temp 1 2;
          proxy_temp_path /var/cache/nginx/proxy_temp 1 2;

          map $$request_uri $$expense_cache_control {
              default "no-store";
              "~^/assets/.+-[A-Za-z0-9_-]{8,}\.[A-Za-z0-9]+(?:\?.*)?$$" "public, max-age=31536000, immutable";
          }

          map $$http_x_forwarded_proto $$expense_forwarded_proto {
              default $$scheme;
              https https;
          }

          server {
              listen 8080;
              server_name _;

              access_log off;
              root /usr/share/nginx/html;
              index index.html;
              client_max_body_size 25m;

              add_header Cache-Control $$expense_cache_control always;
              add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' https://*.dingtalk.com; frame-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self' https://*.dingtalk.com https://*.dingcloud.com" always;
              add_header Referrer-Policy "no-referrer" always;
              add_header X-Content-Type-Options "nosniff" always;
              add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;

              location = /api/files/upload {
                  proxy_request_buffering off;
                  proxy_pass http://backend:8000;
                  proxy_http_version 1.1;
                  proxy_set_header Host $$host;
                  proxy_set_header X-Real-IP $$remote_addr;
                  proxy_set_header X-Forwarded-For $$remote_addr;
                  proxy_set_header X-Forwarded-Proto $$expense_forwarded_proto;
                  proxy_set_header X-Request-ID $$request_id;
                  proxy_connect_timeout 5s;
                  proxy_read_timeout 135s;
                  proxy_send_timeout 135s;
                  proxy_hide_header Cache-Control;
                  proxy_max_temp_file_size 0;
              }

              location ~ ^/api/reimbursements/drafts/[^/]+/files$$ {
                  proxy_request_buffering off;
                  proxy_pass http://backend:8000;
                  proxy_http_version 1.1;
                  proxy_set_header Host $$host;
                  proxy_set_header X-Real-IP $$remote_addr;
                  proxy_set_header X-Forwarded-For $$remote_addr;
                  proxy_set_header X-Forwarded-Proto $$expense_forwarded_proto;
                  proxy_set_header X-Request-ID $$request_id;
                  proxy_connect_timeout 5s;
                  proxy_read_timeout 135s;
                  proxy_send_timeout 135s;
                  proxy_hide_header Cache-Control;
                  proxy_max_temp_file_size 0;
              }

              location /api/ {
                  proxy_pass http://backend:8000;
                  proxy_http_version 1.1;
                  proxy_set_header Host $$host;
                  proxy_set_header X-Real-IP $$remote_addr;
                  proxy_set_header X-Forwarded-For $$remote_addr;
                  proxy_set_header X-Forwarded-Proto $$expense_forwarded_proto;
                  proxy_set_header X-Request-ID $$request_id;
                  proxy_connect_timeout 5s;
                  proxy_read_timeout 135s;
                  proxy_send_timeout 135s;
                  proxy_hide_header Cache-Control;
                  proxy_max_temp_file_size 0;
              }

              location ^~ /assets/ {
                  try_files $$uri =404;
              }

              location = /index.html {
                  try_files $$uri =404;
              }

              location / {
                  try_files $$uri $$uri/ /index.html;
              }
          }
      }

volumes:
  sqlite_data:
  reimbursement_staging:
